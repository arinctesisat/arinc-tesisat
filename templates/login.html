<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | Arınç Tesisat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #001d3d; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        .btn-primary { background: #003566; border: none; padding: 12px; }
        .btn-primary:hover { background: #ffc300; color: #001d3d; }
    </style>
</head>
<body>

<div class="login-card text-center">
    <h3 class="fw-bold mb-4">Yönetim Paneli</h3>
    <form action="/admin" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
            <input type="text" name="u" class="form-control form-control-lg" placeholder="Kullanıcı Adı" required>
        </div>
        <div class="mb-4">
            <input type="password" name="p" class="form-control form-control-lg" placeholder="Şifre" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold">Giriş Yap</button>
    </form>
    <div class="mt-3">
        <a href="/" class="text-muted small text-decoration-none">← Siteye Geri Dön</a>
    </div>
</div>

</body>
</html>
